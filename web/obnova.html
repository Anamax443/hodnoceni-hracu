<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nové heslo</title>
<link rel="stylesheet" href="/app.css">
<script>
    (function () {
        var t;
        try { t = localStorage.getItem('hodnoceni.theme'); } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
    })();
</script>
</head>
<body>

<header class="topbar">
    <span class="brand" id="hl-nadpis">⚽</span>
    <span class="tools">
        <span class="hodiny" id="hodiny"></span>
        <span class="verze" id="verze"></span>
        <button id="jazykBtn"></button>
        <button id="themeBtn"></button>
    </span>
</header>

<main id="obsah"></main>

<script type="module" src="/obnova.js"></script>
</body>
</html>
