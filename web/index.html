<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hodnocení hráčů</title>
<link rel="stylesheet" href="app.css">
<script>
    /* Vzhled se nastaví dřív, než se stránka vykreslí — jinak by při tmavém
       vzhledu problikla bílá. Zbytek ovládá app.js. */
    (function () {
        var t;
        try { t = localStorage.getItem('hodnoceni.theme'); } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
    })();
</script>
</head>
<body>

<header class="topbar">
    <span class="brand" id="hl-klub">⚽</span>
    <span class="app" id="hl-app"></span>
    <span class="obdobi" id="hl-obdobi"></span>
    <span class="tools">
        <span class="hodiny" id="hodiny"></span>
        <span class="verze" id="verze"></span>
        <button id="jazykBtn"></button>
        <button id="themeBtn"></button>
        <button id="odhlasit" hidden></button>
    </span>
</header>

<div id="prihlaseni" hidden>
    <div class="karta login">
        <h2 id="login-nadpis"></h2>
        <p class="popis" id="login-popis"></p>
        <div class="pole">
            <label for="heslo" id="login-heslo-label"></label>
            <input type="password" id="heslo" autocomplete="current-password">
        </div>
        <button class="hl" id="prihlasit"></button>
        <button class="vedlejsi" id="zapomenute"></button>
        <div id="prihlaseni-chyba"></div>
    </div>

    <div class="karta login" id="obnova-karta" hidden>
        <h2 id="obnova-nadpis"></h2>
        <p class="popis" id="obnova-popis"></p>
        <div class="pole">
            <label for="obnova-email" id="obnova-email-label"></label>
            <input type="text" id="obnova-email" autocomplete="email">
        </div>
        <button class="hl" id="obnova-poslat"></button>
        <button class="vedlejsi" id="obnova-zpet"></button>
        <div id="obnova-hlaska"></div>
    </div>
</div>

<div id="aplikace" hidden>
    <nav id="zalozky">
        <button data-z="lide" class="aktivni"></button>
        <button data-z="hodnotit"></button>
        <button data-z="listy"></button>
        <button data-z="porovnani"></button>
        <button data-z="odkazy"></button>
        <button data-z="nastaveni"></button>
    </nav>
    <main id="obsah"></main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
