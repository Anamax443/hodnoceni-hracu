<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hodnocení hráčů – SK Říčmanice</title>
<style>
    /* ===== TISK: jeden hráč = jedna A4 ===== */
    @page { size: A4 portrait; margin: 12mm; }
    @media print {
        body { margin: 0; padding: 0; background: #fff; }
        .page { page-break-after: always; box-shadow: none; margin: 0; padding: 0; max-width: none; }
        .page:last-child { page-break-after: auto; }
        .noprint { display: none; }
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        color: #333;
        font-size: 11px;
        line-height: 1.35;
        margin: 0 auto;
        padding: 15px;
        max-width: 900px;
        background: #eceff1;
    }

    .page {
        background: #fff;
        padding: 18px 22px;
        margin: 0 auto 20px;
        max-width: 820px;
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    /* ===== HLAVIČKA ===== */
    .header {
        border-bottom: 2px solid #2196F3;
        padding-bottom: 7px;
        margin-bottom: 9px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }
    .header h1 { margin: 0; font-size: 1.3em; color: #333; }
    .header .club { color: #2196F3; font-weight: bold; letter-spacing: .5px; }
    .header .meta { color: #666; font-size: .9em; text-align: right; }

    /* ===== JMÉNO HRÁČE ===== */
    .playerbar {
        background: #2196F3;
        color: #fff;
        padding: 6px 12px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }
    .playerbar .name { font-size: 1.3em; font-weight: bold; }
    .playerbar .role { font-size: .95em; }

    /* ===== GRAF ===== */
    .chart-wrap { text-align: center; margin: 0 0 2px; }
    .chart-wrap svg { max-width: 470px; }
    .legend {
        display: flex; gap: 16px; justify-content: center;
        font-size: .9em; color: #555; margin-bottom: 8px;
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .swatch { width: 15px; height: 9px; display: inline-block; border-radius: 2px; }

    /* ===== TŘI SLOVNÍ BLOKY VEDLE SEBE (zbylé rohy modelu) ===== */
    .blocks { display: flex; gap: 8px; margin-bottom: 8px; }
    .block {
        flex: 1;
        border-left: 3px solid #2196F3;
        padding: 5px 8px;
        border-radius: 0 4px 4px 0;
    }
    .block h4 { margin: 0 0 2px; font-size: .95em; }
    .block p { margin: 0; }

    .block.fyz   { border-left-color: #43A047; background: #f4faf5; }
    .block.fyz h4   { color: #2E7D32; }
    .block.hlava { border-left-color: #FB8C00; background: #fffaf3; }
    .block.hlava h4 { color: #EF6C00; }
    .block.parta { border-left-color: #8E24AA; background: #fbf6fd; }
    .block.parta h4 { color: #6A1B9A; }

    /* ===== CÍLE ===== */
    .goals {
        border: 1px solid #ffca28;
        background: #fffdf2;
        border-radius: 4px;
        padding: 7px 10px;
        margin-bottom: 8px;
    }
    .goals h4 { margin: 0 0 3px; color: #F57F17; font-size: .98em; }
    .goals ol { margin: 0; padding-left: 18px; }
    .goals li { margin-bottom: 2px; }

    /* ===== ŠKÁLA ===== */
    .scale {
        font-size: .85em;
        color: #555;
        border-top: 1px dashed #bbb;
        padding-top: 5px;
        display: flex;
        flex-wrap: wrap;
        gap: 3px 14px;
    }
    .scale b { color: #333; }

    /* ===== PATIČKA ===== */
    .footer {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: .85em;
        color: #666;
    }
    .sign { border-top: 1px solid #999; width: 180px; text-align: center; padding-top: 3px; }

    .note-unfilled { color: #c62828; font-weight: bold; margin: 4px 0; }

    /* ===== OVLÁDÁNÍ (netiskne se) ===== */
    .toolbar { max-width: 820px; margin: 0 auto 14px; text-align: right; }
    .toolbar button {
        background: #2196F3; color: #fff; border: 0; padding: 8px 16px;
        border-radius: 4px; font-size: 13px; cursor: pointer;
    }
</style>
</head>
<body>

<div class="toolbar noprint">
    <button onclick="window.print()">🖨️ Vytisknout všechny listy</button>
</div>

<div id="output"></div>

<script>
/* =====================================================================
   HODNOTÍCÍ LISTY HRÁČŮ – SK ŘÍČMANICE
   Rámec: FA Four Corner Model
     - technicko-taktický roh  -> radar graf (čísla)
     - fyzický / psychologický / sociální roh -> slovní bloky (bez čísel)

   ÚPRAVA DAT: mění se POUZE pole HRACI. Zbytek je vykreslovací logika.
   ===================================================================== */

/* --- ŠABLONY OS -----------------------------------------------------
   Počet os je libovolný, graf se přizpůsobí:
   5 os = pětiúhelník, 6 = šestiúhelník, 8 = osmiúhelník.
   POZOR: šablonu neměnit uprostřed sezóny. Jinak nelze porovnat
   aktuální hodnocení s předchozím (jiný počet vrcholů = jiný tvar).
--------------------------------------------------------------------- */
const SABLONY = {
    pole: [
        { klic: 'prava',     popis: 'Technika pravá noha' },
        { klic: 'leva',      popis: 'Technika levá noha' },
        { klic: 'hlavicky',  popis: 'Hlavičkování' },
        { klic: 'prihravka', popis: 'Přihrávka a první dotek' },
        { klic: 'braneni',   popis: 'Bránění 1v1' },
        { klic: 'skenovani', popis: 'Skenování a poziční hra' }
    ],
    brankar: [
        { klic: 'chytani',    popis: 'Chytání a zákroky' },
        { klic: 'misto',      popis: 'Výběr místa a postavení' },
        { klic: 'nohama',     popis: 'Hra nohama (rozehrávka)' },
        { klic: 'vykopy',     popis: 'Výkopy a dlouhá rozehrávka' },
        { klic: 'mimo',       popis: 'Hra mimo bránu a centry' },
        { klic: 'organizace', popis: 'Organizace a komunikace' }
    ]
};

/* --- ŠKÁLA 1–10: pevné kotvy, aby hodnocení nedriftovalo mezi sezónami --- */
const KOTVY = [
    ['1–3', 'začínám, jen v klidu bez tlaku'],
    ['4–5', 'umím na tréninku, v zápase kolísá'],
    ['6–7', 'spolehlivé i v zápase'],
    ['8–9', 'silná stránka, opora týmu'],
    ['10',  'nadstandard pro kategorii']
];

/* --- DATA HRÁČŮ -----------------------------------------------------
   hodnoceni = aktuální (modrý polygon)
   predchozi = minulé období (šedý čárkovaný obrys); null = nevykreslí se
   hodnoceni: null => list se vytiskne prázdný s červenou poznámkou
--------------------------------------------------------------------- */
const HRACI = [
    {
        jmeno: 'Vzorový Jan',
        prezdivka: 'Vzorek',
        post: 'Střední záložník',
        sablona: 'pole',
        hodnoceni: { prava: 7, leva: 4, hlavicky: 5, prihravka: 7, braneni: 5, skenovani: 4 },
        predchozi: { prava: 6, leva: 3, hlavicky: 4, prihravka: 5, braneni: 5, skenovani: 3 },
        fyzicky: 'Vytrvalost na dobré úrovni, ve druhém poločase neodpadá. V růstové fázi, v soubojích zatím tahá za kratší konec. To se srovná.',
        hlavou: 'Po chybě se rychle vrátí do hry a nehroutí se. Když se nedaří, začne to zkoušet sám místo kombinace. Na tom pracujeme.',
        parta: 'V kabině tahoun, mladší kluky bere mezi sebe. Na hřišti mluví málo, přitom by mu ostatní naslouchali.',
        cile: [
            'Rozhlédnout se DŘÍV, než ke mně míč dorazí. Dvakrát před každým příjmem.',
            'Levá noha: každý trénink 5 minut navíc, přihrávka do 10 metrů.',
            'Nahlas řídit spoluhráče kolem sebe, minimálně při standardkách.'
        ]
    },
    {
        jmeno: 'Vzorový Petr',
        prezdivka: 'Vzorák',
        post: 'Brankář',
        sablona: 'brankar',
        hodnoceni: { chytani: 7, misto: 5, nohama: 6, vykopy: 4, mimo: 4, organizace: 6 },
        predchozi: { chytani: 6, misto: 4, nohama: 4, vykopy: 4, mimo: 3, organizace: 5 },
        fyzicky: 'Odraz a rychlost do strany slušné. Chybí síla v dolní části zad, projeví se to na délce výkopu.',
        hlavou: 'Po inkasované brance chvíli vypadne z koncentrace. Ve druhém poločase zpomalí rozehrávku a začne kopat dlouhé míče.',
        parta: 'Spolehlivý, chodí včas, nestěžuje si. Obraně věří, ale nedává jí to najevo hlasem.',
        cile: [
            'Rozehrávku po zemi držet i ve druhém poločase. Nezastavovat míč a nekopat na náhodu.',
            'Výběr místa při centru: krok dopředu, ne vzad.',
            'Hlásit obraně tlak zezadu dřív, než k ní míč dorazí.'
        ]
    }
];

/* =====================================================================
   RADAR – generický pro libovolný počet os
   ===================================================================== */

const MAX = 10;     // maximum škály
const KRUHY = 5;    // počet soustředných úrovní (po 2 bodech)

/* Souřadnice bodu na ose i (osa 0 = nahoře, dál po směru hodin) */
function bod(cx, cy, r, i, n) {
    const uhel = (Math.PI * 2 * i / n) - Math.PI / 2;
    return { x: cx + r * Math.cos(uhel), y: cy + r * Math.sin(uhel) };
}

/* Sestaví "x,y x,y ..." pro <polygon> z pole hodnot */
function polygon(cx, cy, R, hodnoty, n) {
    return hodnoty.map((h, i) => {
        const p = bod(cx, cy, R * h / MAX, i, n);
        return p.x.toFixed(1) + ',' + p.y.toFixed(1);
    }).join(' ');
}

/* Zalomí dlouhý popisek osy na dva řádky */
function zalom(text) {
    if (text.length <= 17) return [text];
    const slova = text.split(' ');
    let a = '', b = '';
    slova.forEach(s => {
        if (b === '' && (a + ' ' + s).trim().length <= 17) a = (a + ' ' + s).trim();
        else b = (b + ' ' + s).trim();
    });
    return b ? [a, b] : [a];
}

function radar(osy, hodnoceni, predchozi) {
    const n = osy.length;
    const W = 470, H = 300, cx = 235, cy = 148, R = 100;
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Hodnocení hráče">`;

    // --- mřížka: soustředné n-úhelníky ---
    for (let k = KRUHY; k >= 1; k--) {
        const r = R * k / KRUHY;
        const body = [];
        for (let i = 0; i < n; i++) {
            const p = bod(cx, cy, r, i, n);
            body.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
        }
        svg += `<polygon points="${body.join(' ')}" fill="${k % 2 ? '#ffffff' : '#fafafa'}" stroke="#cccccc" stroke-width="1"/>`;
    }

    // --- paprsky a popisky os ---
    for (let i = 0; i < n; i++) {
        const p = bod(cx, cy, R, i, n);
        svg += `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#cccccc" stroke-width="1"/>`;

        const l = bod(cx, cy, R + 22, i, n);
        let anchor = 'middle';
        if (l.x > cx + 6) anchor = 'start';
        if (l.x < cx - 6) anchor = 'end';

        const radky = zalom(osy[i].popis);
        const hodnota = hodnoceni ? hodnoceni[osy[i].klic] : null;
        const yStart = l.y - (radky.length - 1) * 5;

        radky.forEach((r, ri) => {
            svg += `<text x="${l.x.toFixed(1)}" y="${(yStart + ri * 10).toFixed(1)}" text-anchor="${anchor}" font-size="9.5" font-family="Arial" fill="#444444">${r}</text>`;
        });
        if (hodnota !== null && hodnota !== undefined) {
            svg += `<text x="${l.x.toFixed(1)}" y="${(yStart + radky.length * 10 + 1).toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="bold" font-family="Arial" fill="#1565C0">${hodnota}/10</text>`;
        }
    }

    // --- předchozí hodnocení: šedý čárkovaný obrys pod aktuálním ---
    if (predchozi) {
        const h = osy.map(o => predchozi[o.klic] ?? 0);
        svg += `<polygon points="${polygon(cx, cy, R, h, n)}" fill="#9e9e9e" fill-opacity="0.15" stroke="#757575" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    }

    // --- aktuální hodnocení ---
    if (hodnoceni) {
        const h = osy.map(o => hodnoceni[o.klic] ?? 0);
        svg += `<polygon points="${polygon(cx, cy, R, h, n)}" fill="#2196F3" fill-opacity="0.40" stroke="#1565C0" stroke-width="2.5"/>`;
        h.forEach((v, i) => {
            const p = bod(cx, cy, R * v / MAX, i, n);
            svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#1565C0"/>`;
        });
    }

    svg += '</svg>';
    return svg;
}

/* =====================================================================
   SESTAVENÍ LISTU
   ===================================================================== */

const SEZONA = '2025/2026';
const OBDOBI = 'závěrečné hodnocení sezóny';
const DATUM  = new Date().toLocaleDateString('cs-CZ');

function list(h) {
    const osy = SABLONY[h.sablona];
    const nevyplneno = !h.hodnoceni;

    return `
    <div class="page">
        <div class="header">
            <div>
                <div class="club">SK ŘÍČMANICE</div>
                <h1>Hodnocení hráče</h1>
            </div>
            <div class="meta">
                Starší žáci • sezóna ${SEZONA}<br>
                ${OBDOBI}<br>
                Vystaveno: ${DATUM}
            </div>
        </div>

        <div class="playerbar">
            <span class="name">${h.jmeno}${h.prezdivka ? ' „' + h.prezdivka + '"' : ''}</span>
            <span class="role">${h.post}</span>
        </div>

        ${nevyplneno ? '<p class="note-unfilled">⚠ Hodnocení zatím nevyplněno – doplň data v souboru.</p>' : ''}

        <div class="chart-wrap">${radar(osy, h.hodnoceni, h.predchozi)}</div>
        <div class="legend">
            <span><i class="swatch" style="background:#2196F3;opacity:.6"></i> teď</span>
            ${h.predchozi ? '<span><i class="swatch" style="background:#9e9e9e;opacity:.5"></i> minule</span>' : ''}
        </div>

        <div class="blocks">
            <div class="block fyz">
                <h4>Fyzicky</h4>
                <p>${h.fyzicky || '—'}</p>
            </div>
            <div class="block hlava">
                <h4>Hlavou</h4>
                <p>${h.hlavou || '—'}</p>
            </div>
            <div class="block parta">
                <h4>V partě</h4>
                <p>${h.parta || '—'}</p>
            </div>
        </div>

        <div class="goals">
            <h4>🎯 Na čem makáme do zimy</h4>
            <ol>${(h.cile || []).map(c => '<li>' + c + '</li>').join('')}</ol>
        </div>

        <div class="scale">
            <b>Jak číst čísla:</b>
            ${KOTVY.map(k => `<span><b>${k[0]}</b> – ${k[1]}</span>`).join('')}
        </div>

        <div class="footer">
            <div>Graf tě porovnává s tím, co má umět starší žák. Ne se spoluhráči.<br>
                 Tvary mezi sebou neporovnávejte, leváci a praváci mají zub na opačné straně.</div>
            <div class="sign">trenér</div>
        </div>
    </div>`;
}

document.getElementById('output').innerHTML = HRACI.map(list).join('');
</script>
</body>
</html>
